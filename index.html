<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .chat {
      width: 350px;
      max-width: 92%;
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 20px #0002;
    }

    h2 {
      text-align: center;
      color: #4f46e5;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .user, .bot {
      padding: 10px;
      border-radius: 10px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .user {
      background: #dbeafe;
      text-align: right;
    }

    .bot {
      background: #f3f4f6;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }
  </style>
</head>

<body>
  <div class="chat">
    <h2>🤖 My AI Assistant</h2>

    <div id="messages" aria-live="polite">
      <div class="bot">
        Hello! I am your mini AI. Ask me something!
      </div>
    </div>

    <div class="controls">
      <input
        id="question"
        placeholder="Type a message..."
        aria-label="Your message"
        onkeydown="if(event.key==='Enter') sendMessage()"
      >
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function getAIResponse(message) {
      const text = message.toLowerCase();

      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! 😊 How can I help you?";
      }

      if (text.includes("your name")) {
        return "I am Mini AI, your simple chatbot!";
      }

      if (text.includes("how are you")) {
        return "I am doing great! Thanks for asking.";
      }

      if (text.includes("time")) {
        return "The current time is " +
          new Date().toLocaleTimeString();
      }

      if (text.includes("date")) {
        return "Today's date is " +
          new Date().toLocaleDateString();
      }

      if (text.includes("html")) {
        return "HTML is used to create webpages.";
      }

      if (text.includes("javascript")) {
        return "JavaScript makes webpages interactive.";
      }

      if (text.includes("help")) {
        return "You can ask me about HTML, JavaScript, " +
          "the date, or the time.";
      }

      if (text.includes("bye")) {
        return "Goodbye! Have a great day! 👋";
      }

      return "I don't know that yet! Try asking about " +
        "HTML, JavaScript, the date, or the time.";
    }

    function sendMessage() {
      const input = document.getElementById("question");
      const messages = document.getElementById("messages");
      const question = input.value.trim();

      if (!question) return;

      const userMessage = document.createElement("div");
      userMessage.className = "user";
      userMessage.textContent = question;
      messages.appendChild(userMessage);

      const botMessage = document.createElement("div");
      botMessage.className = "bot";
      botMessage.textContent = getAIResponse(question);
      messages.appendChild(botMessage);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;
      input.focus();
    }
  </script>
</body>
</html>
